<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال بريد إلكتروني | آهات صوتية</title>
    
    <!-- شعار الموقع في تبويب المتصفح (Favicon) -->
    <link rel="icon" type="image/png" href="https://files.catbox.moe/akiaa2.png">
    <link rel="shortcut icon" type="image/png" href="https://files.catbox.moe/akiaa2.png">

    <!-- استدعاء الخطوط المطلوبة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;700;900&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --notice-bg: rgba(79, 70, 229, 0.15);
            --notice-border: rgba(79, 70, 229, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Estedad', 'Noto Kufi Arabic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        /* ترويسة الصورة Banner */
        .header-image-container {
            width: 100%;
            height: 160px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.2);
        }

        .header-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* نموذج البريد */
        .content {
            padding: 24px;
        }

        .form-header {
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Noto Kufi Arabic', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Estedad', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--primary-color);
        }

        .form-textarea {
            resize: vertical;
            min-height: 110px;
        }

        /* تنويه إرسال الملفات الصوتية عبر الإيميل */
        .audio-notice {
            background-color: var(--notice-bg);
            border: 1px solid var(--notice-border);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.5;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            margin-top: 20px;
            background-color: var(--primary-color);
            color: #ffffff;
            font-family: 'Estedad', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ترويسة الصورة Banner -->
        <div class="header-image-container">
            <img src="https://files.catbox.moe/yfpo5u.png" alt="ترویسة آهات صوتية" class="header-image">
        </div>

        <!-- نموذج إرسال الرسالة -->
        <div class="content">
            <div class="form-header">
                <h1 class="title">إرسال بريد إلكتروني تلقائي</h1>
                <p class="subtitle">أدخل بياناتك وسيتم فتح تطبيق البريد لديك مباشرةً لإرسال الرسالة.</p>
            </div>

            <form id="emailForm">
                
                <!-- موضوع الرسالة -->
                <div class="form-group">
                    <label for="emailSubject" class="form-label">الموضوع:</label>
                    <input type="text" id="emailSubject" class="form-input" placeholder="اكتب موضوع الرسالة هنا..." value="رسالة جديدة من موقع آهات صوتية" required>
                </div>

                <!-- محتوى الرسالة -->
                <div class="form-group">
                    <label for="emailBody" class="form-label">محتوى الرسالة:</label>
                    <textarea id="emailBody" class="form-textarea" placeholder="اكتب التفاصيل هنا..." required></textarea>
                </div>

                <!-- التنويه الخاص بإرفاق الملفات الصوتية -->
                <div class="audio-notice">
                    <span>💡</span>
                    <span><strong>تنويه:</strong> لإرسال ملف صوتي قم بالضغط على إرسال وتقم بإضافته من الإيميل.</span>
                </div>

                <!-- زر الإرسال -->
                <button type="submit" id="submitBtn" class="btn">
                    <span>إرسال الرسالة الآن</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const emailForm = document.getElementById('emailForm');

        emailForm.addEventListener('submit', function(e) {
            e.preventDefault();

            // البريد المستهدف الذي ستصلك الرسائل عليه
            const recipientEmail = "sultan2021alamoudi@gmail.com";

            const subject = encodeURIComponent(document.getElementById('emailSubject').value);
            const body = encodeURIComponent(document.getElementById('emailBody').value);

            // فتح تطبيق البريد الافتراضي مع تجهيز النص والموضوع والبريد المستهدف
            window.location.href = `mailto:${recipientEmail}?subject=${subject}&body=${body}`;
        });
    </script>
</body>
</html>
