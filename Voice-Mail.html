<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج التواصل - آهات صوتية</title>
    <style>
        /* إعادة ضبط التنسيقات الأساسية وتعيين الخط والاتجاه */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* حاوية النموذج الرئيسية */
        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        /* تنسيق شعار الموقع */
        .logo {
            max-width: 120px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .form-container h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 1.5rem;
        }

        /* تنسيق الحقول والتسميات */
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #555;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* تنسيق زر الإرسال */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <!-- شعار الموقع -->
        <img src="https://files.catbox.moe/akiaa2.png" alt="شعار الموقع" class="logo">
        
        <h2>تواصل معنا</h2>

        <!-- نموذج Formspree -->
        <form action="https://formspree.io/f/mgaeejqq" method="POST">
            
            <!-- حقل الاسم -->
            <div class="form-group">
                <label for="name">الاسم</label>
                <input type="text" id="name" name="name" placeholder="أدخل اسمك" required>
            </div>

            <!-- حقل البريد الإلكتروني -->
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <!-- حقل الرسالة -->
            <div class="form-group">
                <label for="message">الرسالة</label>
                <textarea id="message" name="message" placeholder="اكتب رسالتك هنا..." required></textarea>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" class="submit-btn">إرسال</button>

        </form>
    </div>

</body>
</html>
