<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال بريد إلكتروني | آهات صوتية</title>
    
    <!-- استدعاء الخطوط المطلوبة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;700;900&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Estedad', 'Noto Kufi Arabic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        /* ترويسة الصورة Banner */
        .header-image-container {
            width: 100%;
            height: 160px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.2);
        }

        .header-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* نموذج البريد */
        .content {
            padding: 24px;
        }

        .form-header {
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Noto Kufi Arabic', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Estedad', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--primary-color);
        }

        .form-textarea {
            resize: vertical;
            min-height: 110px;
        }

        /* قسم إضافة الملفات */
        .file-upload-wrapper {
            position: relative;
            background-color: var(--input-bg);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary-color);
        }

        .file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .file-name-display {
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--accent-color);
            word-break: break-all;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            margin-top: 24px;
            background-color: var(--primary-color);
            color: #ffffff;
            font-family: 'Estedad', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ترويسة الصورة Banner -->
        <div class="header-image-container">
            <img src="https://files.catbox.moe/yfpo5u.png" alt="ترویسة آهات صوتية" class="header-image">
        </div>

        <!-- نموذج إنشاء الرسالة -->
        <div class="content">
            <div class="form-header">
                <h1 class="title">إنشاء رسالة إلكترونية</h1>
                <p class="subtitle">قم بتعبئة موضوع الرسالة والنص للانتقال المباشر إلى البريد.</p>
            </div>

            <form id="emailForm">
                <!-- موضوع الرسالة -->
                <div class="form-group">
                    <label for="emailSubject" class="form-label">الموضوع:</label>
                    <input type="text" id="emailSubject" class="form-input" placeholder="اكتب موضوع الرسالة هنا..." value="تواصل عبر موقع آهات صوتية">
                </div>

                <!-- نص الرسالة -->
                <div class="form-group">
                    <label for="emailBody" class="form-label">محتوى الرسالة:</label>
                    <textarea id="emailBody" class="form-textarea" placeholder="اكتب نص رسالتك هنا..."></textarea>
                </div>

                <!-- إرفاق ملفات -->
                <div class="form-group">
                    <label class="form-label">إرفاق ملفات (اختياري):</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="fileAttachment" class="file-input" multiple>
                        <span class="file-label" id="fileLabel">📁 اضغط هنا أو اسحب الملفات لإرفاقها</span>
                    </div>
                    <div id="fileNameDisplay" class="file-name-display"></div>
                </div>

                <!-- زر الإرسال -->
                <button type="submit" class="btn">
                    <span>إرسال الرسالة الإلكترونية</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const emailForm = document.getElementById('emailForm');
        const emailSubject = document.getElementById('emailSubject');
        const emailBody = document.getElementById('emailBody');
        const fileAttachment = document.getElementById('fileAttachment');
        const fileLabel = document.getElementById('fileLabel');
        const fileNameDisplay = document.getElementById('fileNameDisplay');

        // البريد المستهدف
        const targetEmail = 'almajdayam@gmail.com';

        // تحديث اسم الملف المرفق عند الاختيار
        fileAttachment.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                let names = Array.from(this.files).map(f => f.name).join(', ');
                fileNameDisplay.textContent = 'الملفات المحددة: ' + names;
                fileLabel.textContent = 'تم اختيار ' + this.files.length + ' ملف/ملفات';
            } else {
                fileNameDisplay.textContent = '';
                fileLabel.textContent = '📁 اضغط هنا أو اسحب الملفات لإرفاقها';
            }
        });

        // دالة تجميع الرسالة وتجهيز رابط mailto
        function sendEmail() {
            let subject = encodeURIComponent(emailSubject.value.trim() || 'تواصل عبر موقع آهات صوتية');
            let bodyText = emailBody.value.trim();
            
            if (fileAttachment.files.length > 0) {
                bodyText += '\n\n(ملاحظة: يرجى إرفاق الملفات المحددة يدوياً من داخل تطبيق البريد الإلكتروني)';
            }
            
            let body = encodeURIComponent(bodyText);
            
            // فتح تطبيق البريد تلقائياً موجهاً إلى البريد المحدد
            window.location.href = `mailto:${targetEmail}?subject=${subject}&body=${body}`;
        }

        // عند الضغط على زر الإرسال
        emailForm.addEventListener('submit', function(e) {
            e.preventDefault();
            sendEmail();
        });
    </script>
</body>
</html>
