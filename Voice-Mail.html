<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال بريد إلكتروني | آهات صوتية</title>
    
    <!-- استدعاء الخطوط المطلوبة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;700;900&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Estedad', 'Noto Kufi Arabic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        /* ترويسة الصورة Banner */
        .header-image-container {
            width: 100%;
            height: 160px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.2);
        }

        .header-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* نموذج البريد */
        .content {
            padding: 24px;
        }

        .form-header {
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Noto Kufi Arabic', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Estedad', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--primary-color);
        }

        .form-textarea {
            resize: vertical;
            min-height: 110px;
        }

        /* قسم إضافة الملفات */
        .file-upload-wrapper {
            position: relative;
            background-color: var(--input-bg);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary-color);
        }

        .file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .file-name-display {
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--accent-color);
            word-break: break-all;
        }

        .status-message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
        }

        .status-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            margin-top: 20px;
            background-color: var(--primary-color);
            color: #ffffff;
            font-family: 'Estedad', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ترويسة الصورة Banner -->
        <div class="header-image-container">
            <img src="https://files.catbox.moe/yfpo5u.png" alt="ترویسة آهات صوتية" class="header-image">
        </div>

        <!-- نموذج إرسال الرسالة والملفات -->
        <div class="content">
            <div class="form-header">
                <h1 class="title">إرسال بريد إلكتروني تلقائي</h1>
                <p class="subtitle">أدخل بياناتك وارفق أي ملف ليتم إرساله مباشرةً إلى صندوق البريد.</p>
            </div>

            <!-- يتم استبدال الكود FORM_ID_HERE بـ ID حسابك في Formspree -->
            <form id="emailForm" action="https://formspree.io/f/FORM_ID_HERE" method="POST" enctype="multipart/form-data">
                
                <!-- بريد المنسق/المرسل -->
                <div class="form-group">
                    <label for="userEmail" class="form-label">بريدك الإلكتروني (للرد عليك):</label>
                    <input type="email" id="userEmail" name="email" class="form-input" placeholder="example@domain.com" required>
                </div>

                <!-- موضوع الرسالة -->
                <div class="form-group">
                    <label for="emailSubject" class="form-label">الموضوع:</label>
                    <input type="text" id="emailSubject" name="subject" class="form-input" placeholder="اكتب موضوع الرسالة هنا..." value="ملف جديد من موقع آهات صوتية" required>
                </div>

                <!-- محتوى الرسالة -->
                <div class="form-group">
                    <label for="emailBody" class="form-label">محتوى الرسالة:</label>
                    <textarea id="emailBody" name="message" class="form-textarea" placeholder="اكتب التفاصيل هنا..." required></textarea>
                </div>

                <!-- إرفاق ملف حقيقي (مضغوط، صوتي، صورة، إلخ) -->
                <div class="form-group">
                    <label class="form-label">إرفاق ملف (ZIP, MP3, PNG, إلخ):</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="fileAttachment" name="upload_file" class="file-input" required>
                        <span class="file-label" id="fileLabel">📁 اضغط هنا لإرفاق الملف المباشر</span>
                    </div>
                    <div id="fileNameDisplay" class="file-name-display"></div>
                </div>

                <!-- زر الإرسال -->
                <button type="submit" id="submitBtn" class="btn">
                    <span>إرسال الملف والرسالة الآن</span>
                </button>

                <!-- صندوق التنبيهات -->
                <div id="statusMessage" class="status-message"></div>
            </form>
        </div>
    </div>

    <script>
        const emailForm = document.getElementById('emailForm');
        const fileAttachment = document.getElementById('fileAttachment');
        const fileLabel = document.getElementById('fileLabel');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        // تحديث اسم الملف فور الاختيار
        fileAttachment.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                let file = this.files[0];
                fileNameDisplay.textContent = 'الملف المحدد: ' + file.name + ' (' + (file.size / (1024 * 1024)).toFixed(2) + ' ميجابايت)';
                fileLabel.textContent = 'تم اختيار الملف بنجاح';
            } else {
                fileNameDisplay.textContent = '';
                fileLabel.textContent = '📁 اضغط هنا لإرفاق الملف المباشر';
            }
        });

        // إرسال البيانات عبر AJAX دون الخروج من الصفحة
        emailForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // التأكد من أن الرابط ليس القالب الافتراضي
            if (emailForm.action.includes('FORM_ID_HERE')) {
                statusMessage.className = 'status-message status-error';
                statusMessage.style.display = 'block';
                statusMessage.textContent = 'يرجى وضع Form ID الخاص بك في كود HTML (مكان FORM_ID_HERE) لتفعيل الإرسال إلى almajdayam@gmail.com.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الإرسال والنقل...';
            statusMessage.style.display = 'none';

            const formData = new FormData(emailForm);

            try {
                const response = await fetch(emailForm.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    statusMessage.className = 'status-message status-success';
                    statusMessage.style.display = 'block';
                    statusMessage.textContent = 'تم إرسال الرسالة والملف بنجاح إلى البريد الإلكتروني!';
                    emailForm.reset();
                    fileNameDisplay.textContent = '';
                    fileLabel.textContent = '📁 اضغط هنا لإرفاق الملف المباشر';
                } else {
                    const data = await response.json();
                    throw new Error(data.error || 'حدث خطأ أثناء رفع الملف.');
                }
            } catch (error) {
                statusMessage.className = 'status-message status-error';
                statusMessage.style.display = 'block';
                statusMessage.textContent = 'تعذر الإرسال: ' + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'إرسال الملف والرسالة الآن';
            }
        });
    </script>
</body>
</html>
