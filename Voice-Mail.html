<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ايميل القناة | آهات صوتية</title>
    
    <!-- استدعاء الخطوط المطلوبة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;700;900&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Estedad', 'Noto Kufi Arabic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden; /* لضمان قص أطراف الصورة على حواف البطاقة */
        }

        /* تنسيق ترويسة الصورة */
        .header-image-container {
            width: 100%;
            height: auto;
            max-height: 200px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.2);
        }

        .header-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* حاوية المحتوى الداخلي */
        .content {
            padding: 32px;
        }

        .title {
            font-family: 'Noto Kufi Arabic', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .audio-wrapper {
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        audio {
            width: 100%;
            outline: none;
        }

        .status-box {
            display: none;
            margin-top: 16px;
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 8px;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-color);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background-color: var(--primary-color);
            color: #ffffff;
            font-family: 'Estedad', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ترويسة الصورة -->
        <div class="header-image-container">
            <img src="https://files.catbox.moe/yfpo5u.png" alt="ترویسة آهات صوتية" class="header-image">
        </div>

        <!-- المحتوى الرئيسي -->
        <div class="content">
            <h1 class="title">مكتبة آهات صوتية</h1>
            <p class="subtitle">استمع إلى المقطع الصوتي حتى النهاية ليتم تحويلك تلقائياً للبريد الإلكتروني.</p>

            <div class="audio-wrapper">
                <!-- قم بتغيير رابط الملف الصوتي حسب اسم وحفظ الملف في مستودعك -->
                <audio id="audioPlayer" controls>
                    <source src="audio.mp3" type="audio/mpeg">
                    متصفحك لا يدعم مشغل الصوتيات.
                </audio>
            </div>

            <div id="statusMessage" class="status-box">
                تم انتهاء المقطع الصوتي، جاري التحويل للبريد...
            </div>

            <button id="directSendBtn" class="btn">الانتقال المباشر إلى البريد</button>
        </div>
    </div>

    <script>
        // تحديد عنصر مشغل الصوت وعنصر التنبيه
        const audioPlayer = document.getElementById('audioPlayer');
        const statusMessage = document.getElementById('statusMessage');
        const directSendBtn = document.getElementById('directSendBtn');

        // البريد المستهدف
        const targetEmail = 'almajdayam@gmail.com';

        // دالة التوجيه إلى تطبيق البريد
        function redirectToEmail() {
            window.location.href = `mailto:${targetEmail}`;
        }

        // الاستماع لحدث انتهاء التشغيل الصوتي
        audioPlayer.addEventListener('ended', function() {
            statusMessage.style.display = 'block';
            setTimeout(function() {
                redirectToEmail();
            }, 1000); // الانتظار ثانية واحدة قبل التحويل
        });

        // الاستماع لضغط زر الانتقال المباشر
        directSendBtn.addEventListener('click', function() {
            redirectToEmail();
        });
    </script>
</body>
</html>
