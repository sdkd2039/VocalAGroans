<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معدودات</title>
    <link rel="icon" type="image/png" href="https://file.garden/aluU_B9tLXBUY8kP/%D8%B4%D8%B9%D8%A7%D8%B5%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%|B%D1%85/T401783946968724.png">

    <link rel="apple-touch-icon" href="https://file.garden/aluU_B9tLXBUY8kP/%D8%B4%D8%B9%D8%A7%D8%B5%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/T401783946968724.png">

    <link rel="apple-touch-icon" sizes="180x180" href="https://file.garden/aluU_B9tLXBUY8kP/%D8%B4%D8%B9%D8%A7%D8%B5%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/T401783946968724.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="معدودات">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #f8fafc;
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --text-muted: #94a3b8;
            --accent-gold: #c5a880;
            --player-bg: #151f32;
            --border-color: #30363d;
            --tab-active: #0052cc;
            --green: #238636;
            --live-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            width: 100%;
        }

        /* تنسيق مقدمة الموقع (Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .splash-gif {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .splash-mobile { display: block; }
        .splash-desktop { display: none; }
        @media (min-width: 768px) {
            .splash-mobile { display: none; }
            .splash-desktop { display: block; }
        }

        img { pointer-events: none; -webkit-touch-callout: none; }
        header { text-align: center; margin-bottom: 15px; width: 100%; }
        .main-logo { max-width: 150px; height: auto; }

        /* شريط الأقسام المتمركز */
        .tabs-wrapper { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; }
        .tabs-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: #21262d; border: 1px solid var(--border-color); color: var(--text-color);
            padding: 10px 15px; border-radius: 14px; font-size: 13px; font-weight: 700; cursor: pointer;
            white-space: nowrap; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 85px; transition: all 0.2s ease;
        }
        .tab-btn img, .tab-btn svg { width: 22px; height: 22px; object-fit: contain; }
        .tab-btn.active { background: var(--tab-active); border-color: var(--tab-active); color: white; box-shadow: 0 0 12px rgba(0, 82, 204, 0.5); }

        .panel-content { width: 100%; max-width: 100%; display: none; }
        .panel-content.active { display: block; }

        .box-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin-bottom: 15px; width: 100%; }
        .box-header { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
        .box-title { font-size: 1.1rem; color: var(--accent-gold); font-weight: 800; }

        /* قسم الأذكار */
        .sub-tabs { display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap; width: 100%; }
        .sub-tab-btn { background: #21262d; border: 1px solid #333; color: #94a3b8; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .sub-tab-btn.active { background: #c5a880; color: #000; border-color: #c5a880; }
        
        .dhikr-card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            padding: 20px 15px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-bottom: 20px; 
            text-align: center; 
            touch-action: pan-y; 
            position: relative; 
            width: 100%;
        }
        .dhikr-text { font-size: 1.3rem; color: #fff; line-height: 2.1; font-weight: 500; margin-bottom: 20px; width: 100%; }
        
        .counter-circle {
            width: 90px; height: 90px; border-radius: 50%; background: #21262d; border: 3px solid var(--accent-gold);
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4); transition: transform 0.1s ease, background 0.2s; margin-bottom: 12px;
        }
        .counter-circle:active { transform: scale(0.93); background: #30363d; }
        .counter-num { font-size: 1.6rem; font-weight: 900; color: var(--accent-gold); }
        .counter-label { font-size: 0.75rem; color: var(--text-muted); }

        .progress-bar-container { width: 100%; background: #21262d; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .progress-bar-fill { height: 100%; background: var(--accent-gold); width: 0%; transition: width 0.3s ease; }

        /* باقي الأقسام والتلاوات */
        .telawat-list, .grid-container { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .telawat-item, .grid-item { background: #161b22; border: 1px solid var(--border-color); padding: 15px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="https://file.garden/aluU_B9tLXBUY8kP/%D8%B4%D8%B9%D8%A7%D8%B5%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D8%B1/%20Counted%20(1).gif" alt="جوال" class="splash-gif splash-mobile">
        <img src="https://file.garden/aluU_B9tLXBUY8kP/%D8%B4%D8%B9%D8%A7%D8%B5%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D8%B1/%20Afew%20(3).gif" alt="لابتوب" class="splash-gif splash-desktop">
    </div>

    <header>
        <img src="https://file.garden/aluU_B9tLXBUY8kP/%D8%B4%D8%B9%D8%A7%D8%B5%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D8%B1/T401783946968724.png" alt="الشعار" class="main-logo">
    </header>

    <div class="tabs-wrapper">
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('telawat', this)">
                <i class="fa-solid fa-book-quran"></i> التلاوات
            </button>
            <button class="tab-btn" onclick="switchTab('zikr', this)">
                <i class="fa-solid fa-hands-praying"></i> الأذكار
            </button>
            <button class="tab-btn" onclick="switchTab('mutaqi', this)">
                <i class="fa-solid fa-clock"></i> العد التنازلي
            </button>
            <button class="tab-btn" onclick="switchTab('live', this)">
                <i class="fa-solid fa-tower-broadcast"></i> بث مباشر
            </button>
        </div>
    </div>

    <div id="panel-telawat" class="panel-content active">
        <div class="box-card">
            <div class="box-header">
                <i class="fa-solid fa-headphones" style="color: var(--accent-gold);"></i>
                <div class="box-title">التلاوات القرآنية</div>
            </div>
            <div class="telawat-list" id="telawat-container">
                <p style="text-align: center; color: var(--text-muted);">جاري تحميل التلاوات...</p>
            </div>
        </div>
    </div>

    <div id="panel-zikr" class="panel-content">
        <div class="box-card">
            <div class="box-header">
                <i class="fa-solid fa-face-smile" style="color: var(--accent-gold);"></i>
                <div class="box-title">حصن المسلم والأذكار</div>
            </div>
            
            <div class="sub-tabs" id="sub-tabs-container">
                <button class="sub-tab-btn active" onclick="showDhikr('الصباح', this)">أذكار الصباح</button>
                <button class="sub-tab-btn" onclick="showDhikr('المساء', this)">أذكار المساء</button>
                <button class="sub-tab-btn" onclick="showDhikr('النوم', this)">أذكار النوم</button>
            </div>

            <div class="dhikr-card" id="dhikr-card-box">
                <div class="dhikr-text" id="dhikr-text-content">اختر قسم الأذكار للبدء</div>
                <div class="counter-circle" onclick="decrementCounter()">
                    <div class="counter-num" id="dhikr-count-display">0</div>
                    <div class="counter-label">المتبقي</div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="dhikr-progress"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="panel-mutaqi" class="panel-content">
        <div class="box-card" style="text-align: center;">
            <div class="box-header" style="justify-content: center;">
                <div class="box-title">المناسبات الإسلامية</div>
            </div>
            <p style="color: var(--text-muted);">المتبقي لحلول شهر رمضان المبارك 1448 هـ</p>
            <h3 id="timer-ramadan" style="font-size: 1.5rem; color: var(--accent-gold); margin-top: 10px;">--</h3>
        </div>
    </div>

    <div id="panel-live" class="panel-content">
        <div class="box-card" style="text-align: center;">
            <div class="box-header" style="justify-content: center;">
                <div class="box-title">إذاعة القرآن الكريم</div>
            </div>
            <audio id="live-audio" controls>
                <source src="https://stream.islamweb.net/Quran/listen.php" type="audio/mpeg">
                متصفحك لا يدعم مشغل الصوت
            </audio>
        </div>
    </div>

    <script>
        // إخفاء شاشة البداية بعد التحميل
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) splash.classList.add('fade-out');
            }, 800);
        });

        // تبديل الأقسام الرئيسية
        function switchTab(tabId, btn) {
            document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('panel-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        // بيانات تجريبية للأذكار لتفعيل التفاعل باللمس
        let dhikrData = [
            { cat: 'الصباح', text: 'رَضِيتُ بِاللَّهِ رَبّاً، وَبِالإِسْلَامِ دِيناً، وَبِمُحَمَّدٍ صلى الله عليه وسلم نَبِيّاً', target: '3', id: 'd1' },
            { cat: 'الصباح', text: 'اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نَافِعاً، وَرِزْقاً طَيِّباً، وَعَمَلاً مُتَقَبَّلاً', target: '1', id: 'd2' },
            { cat: 'المساء', text: 'أَمْسَيْنَا وَأَمْسَى المُلْكُ لِلَّهِ، وَالحَمْدُ لِلَّهِ', target: '4', id: 'd3' }
        ];

        let currentDhikrIndex = 0;
        let activeCategoryDhikrs = [];
        let currentRemaining = 0;
        let currentTotalTarget = 1;

        function showDhikr(cat, btn) {
            if(btn) {
                document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            activeCategoryDhikrs = dhikrData.filter(d => d.cat === cat);
            currentDhikrIndex = 0;
            loadDhikrItem();
        }

        function loadDhikrItem() {
            if (activeCategoryDhikrs.length === 0) return;
            const item = activeCategoryDhikrs[currentDhikrIndex];
            document.getElementById('dhikr-text-content').innerText = item.text;
            currentTotalTarget = parseInt(item.target) || 1;
            
            let storedCount = localStorage.getItem('c_' + item.id);
            currentRemaining = storedCount !== null ? parseInt(storedCount) : currentTotalTarget;
            updateCounterUI();
        }

        function decrementCounter() {
            if (currentRemaining > 0) {
                currentRemaining--;
                const item = activeCategoryDhikrs[currentDhikrIndex];
                localStorage.setItem('c_' + item.id, currentRemaining);
                updateCounterUI();
                
                if (currentRemaining === 0) {
                    setTimeout(() => {
                        if (currentDhikrIndex < activeCategoryDhikrs.length - 1) {
                            currentDhikrIndex++;
                            loadDhikrItem();
                        }
                    }, 300);
                }
            }
        }

        function updateCounterUI() {
            document.getElementById('dhikr-count-display').innerText = currentRemaining;
            let percent = ((currentTotalTarget - currentRemaining) / currentTotalTarget) * 100;
            document.getElementById('dhikr-progress').style.width = percent + '%';
        }

        // دعم اللف يمين ويسار (Swipe) التنقل بين الأذكار بدون أزرار
        let touchStartX = 0;
        let touchEndX = 0;
        const dhikrCardBox = document.getElementById('dhikr-card-box');

        dhikrCardBox.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        dhikrCardBox.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                // سحب لليسار -> الذكر التالي
                if (currentDhikrIndex < activeCategoryDhikrs.length - 1) {
                    currentDhikrIndex++;
                    loadDhikrItem();
                }
            }
            if (touchEndX > touchStartX + 50) {
                // سحب لليمين -> الذكر السابق
                if (currentDhikrIndex > 0) {
                    currentDhikrIndex--;
                    loadDhikrItem();
                }
            }
        }

        // تشغيل أول فئة أذكار تلقائياً عند الفتح
        window.addEventListener('DOMContentLoaded', () => {
            showDhikr('الصباح', document.querySelector('.sub-tab-btn'));
        });
    </script>
</body>
</html>
