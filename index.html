  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131926;
      --text-color: #f8fafc;
      --primary-color: #38bdf8;
      --primary-hover: #0ea5e9;
      --text-muted: #64748b;
      --player-bg: #1a2333;
      --success-color: #10b981;
      --desc-text-color: #94a3b8;
      --favorite-color: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Estedad', 'Noto Kufi Arabic', sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px 40px 15px;
    }
    .container { width: 100%; max-width: 850px; flex: 1; display:flex; flex-direction: column; align-items: center; }
    .boxed-header-container {
      width: 100%;
      height: 280px;
      background-image: linear-gradient(rgba(11,15,25,0.4), rgba(11,15,25,0.75)), url('https://raw.githubusercontent.com/sdkd2039/VocalAGroans/main/header-bg.jpg');
      background-size: cover;
      background-position: center;
      border-radius: 24px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      position: relative;
    }
    .header-main-logo { max-width: 140px; height: auto; margin-bottom: 12px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6)); pointer-events: none; user-select: none; }
    .slogan { font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
    .warning { color: #ff4d4d; background: rgba(11,15,25,0.8); padding: 6px 18px; border-radius: 50px; display: inline-block; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(255,77,77,0.25); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .tabs-container { width:100%; display:flex; justify-content:center; gap:8px; margin-bottom:20px; padding: 0 5px; flex-wrap:wrap; }
    .tab-btn { background:var(--card-bg); border:1px solid #1e293b; color:var(--text-muted); padding:10px 20px; border-radius:12px; cursor:pointer; font-weight:600; font-size:0.9rem; display:flex; gap:8px; align-items:center; }
    .tab-btn.active { background:var(--primary-color); color:var(--bg-color); border-color:var(--primary-color); }
    .fav-badge { background:var(--favorite-color); color:#fff; font-size:0.72rem; font-weight:700; padding:2px 6px; border-radius:50px; min-width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--card-bg); }
    .search-container { width:100%; position:relative; margin-bottom:25px; }
    .search-input { width:100%; background:var(--card-bg); border:1px solid #1e293b; border-radius:14px; padding:15px 45px 15px 15px; color:var(--text-color); font-size:0.95rem; outline:none; }
    .search-input:focus { border-color:var(--primary-color); box-shadow: 0 0 0 3px rgba(56,189,248,0.1); }
    .search-icon { position:absolute; right:18px; top:50%; transform:translateY(-50%); color:var(--text-muted); pointer-events:none; }

    .audio-list { display:grid; grid-template-columns: repeat(2,1fr); gap:16px; width:100%; }
    .audio-card { background:var(--card-bg); border:1px solid #1e293b; border-radius:18px; padding:18px; box-shadow:0 10px 30px rgba(0,0,0,0.2); display:flex; flex-direction:column; gap:15px; }
    .music-note-icon { background: rgba(56,189,248,0.08); border:1px solid rgba(56,189,248,0.15); color:var(--primary-color); width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
    .audio-title { font-size:1rem; font-weight:700; color:#fff; line-height:1.4; }
    .player-controls-container { display:flex; flex-direction:column; gap:12px; background:var(--player-bg); padding:12px; border-radius:14px; border:1px solid rgba(255,255,255,0.01); }
    .timeline { width:100%; height:6px; background:#2e3d52; border-radius:10px; position:relative; cursor:pointer; }
    .progress-bar { height:100%; width:0%; background:linear-gradient(270deg,var(--primary-color),#0ea5e9); border-radius:10px; }
    .time-labels { display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted); font-weight:500; }
    .buttons-row { display:flex; justify-content:space-between; align-items:center; }
    .control-btn { background:none; border:none; color:var(--text-color); cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .btn-play-pause { width:40px; height:40px; border-radius:50%; background: rgba(56,189,248,0.1); border: 2px solid var(--primary-color); color: var(--primary-color); }
    .btn-loop-toggle.is-looping { color:var(--primary-color); }
    .btn-fav-toggle.is-fav { color:var(--favorite-color); }
    .btn-download-action { width:38px; height:38px; border-radius:10px; background: rgba(56,189,248,0.08); border:1px solid rgba(56,189,248,0.2); color:var(--primary-color); }

    .status-message { grid-column: span 2; text-align:center; color:var(--text-muted); padding:40px 20px; font-size:0.9rem; }

    .footer { margin-top:60px; width:100%; max-width:850px; text-align:center; border-top:1px solid #1e293b; padding-top:25px; }
    .footer-rights { font-size:0.95rem; font-weight:700; color:#f8fafc; line-height:1.6; margin-bottom:20px; }
    .footer-socials { display:flex; justify-content:center; gap:15px; }
    .social-link { text-decoration:none; font-size:0.9rem; font-weight:500; display:flex; gap:8px; align-items:center; padding:8px 18px; border-radius:10px; border:1px solid #1e293b; background: rgba(19,25,38,0.6); color:#fff; }

    @media (max-width:650px) {
      .audio-list { grid-template-columns: 1fr; }
      .boxed-header-container { height:210px; border-radius:16px; margin-bottom:20px; }
      .header-main-logo { max-width:100px; }
    }
  </style>
</head>

  <script>
    // Configuration
    const sheetId = '1mvsDJJRJuiDg1s45KwJw7x6dnodiPZck8WNAFz_C8tU';

    // State
    let categoriesData = { 'آهات': [], 'مؤثرات': [], 'انتقالات': [], 'صوت': [] };
    let randomAllAudio = [];
    let activePlayers = {};
    let currentTab = 'all';
    let favoritesList = JSON.parse(localStorage.getItem('vocal_favs_v2') || '[]');

    // Service worker registration (optional)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker?.register('sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }

    // Utility: stable id generator for audio URLs
    function generateCleanId(url) {
      if (!url) return 'audio-' + Math.random().toString(36).substr(2,9);
      let cleaned = url.trim().toLowerCase();
      let hash = 0;
      for (let i = 0; i < cleaned.length; i++) {
        hash = ((hash << 5) - hash) + cleaned.charCodeAt(i);
        hash |= 0;
      }
      return 'audio-' + Math.abs(hash);
    }

    function updateFavBadge() {
      const badge = document.getElementById('favBadge');
      if (!badge) return;
      badge.textContent = favoritesList.length;
      badge.style.display = favoritesList.length === 0 ? 'none' : 'inline-flex';
    }

    async function fetchSheetData(sheetName) {
      try {
        const queryUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=out:json&headers=0&cacheBust=${Date.now()}`;
        const res = await fetch(queryUrl);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows || [];
        return rows.map(row => {
          const title = row.c[0] ? row.c[0].v : 'بدون عنوان';
          const url = row.c[1] ? row.c[1].v : '';
          const desc = row.c[2] ? row.c[2].v : 'مؤثر صوتي';
          const dateAdded = row.c[3] ? (row.c[3].f || row.c[3].v) : '';
          const downloadUrl = (row.c[5] && row.c[5].v) ? row.c[5].v : url;
          const id = generateCleanId(url);
          return { id, title, url, desc, dateAdded, downloadUrl, category: sheetName };
        }).filter(item => item.url && item.url.startsWith('http'));
      } catch (err) {
        console.error('Error fetching sheet', sheetName, err);
        return [];
      }
    }

    async function fetchAllSheetsData() {
      try {
        document.getElementById('statusMessage').textContent = 'جاري جلب البيانات...';
        categoriesData['آهات'] = (await fetchSheetData('آهات')).reverse();
        categoriesData['مؤثرات'] = (await fetchSheetData('مؤثرات')).reverse();
        categoriesData['انتقالات'] = (await fetchSheetData('انتقالات')).reverse();
        categoriesData['صوت'] = (await fetchSheetData('صوت')).reverse();

        let pool = [
          ...categoriesData['آهات'],
          ...categoriesData['مؤثرات'],
          ...categoriesData['انتقالات'],
          ...categoriesData['صوت']
        ];

        // Deduplicate by id
        const uniqueMap = new Map();
        pool.forEach(item => uniqueMap.set(item.id, item));
        const uniquePool = Array.from(uniqueMap.values());
        // pick random subset for 'all' tab
        const shuffled = uniquePool.sort(() => Math.random() - 0.5);
        randomAllAudio = shuffled.slice(0, 6);

        updateFavBadge();
        renderAudioCards();
        checkUrlHashForAudio(uniquePool);
      } catch (err) {
        console.error(err);
        const container = document.getElementById('audioContainer');
        container.innerHTML = '<div class="status-message">حدث خطأ أثناء تحميل الملفات الصوتية.</div>';
      }
    }

    function switchTab(tabName, btnEl) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      if (tabName === 'all') {
        let pool = [
          ...categoriesData['آهات'],
          ...categoriesData['مؤثرات'],
          ...categoriesData['انتقالات'],
          ...categoriesData['صوت']
        ];
        const uniqueMap = new Map();
        pool.forEach(item => uniqueMap.set(item.id, item));
        const uniquePool = Array.from(uniqueMap.values());
        randomAllAudio = uniquePool.sort(() => Math.random() - 0.5).slice(0, 6);
      }

      renderAudioCards();
    }

    function toggleFavorite(id) {
      if (!id) return;
      if (favoritesList.includes(id)) {
        favoritesList = favoritesList.filter(x => x !== id);
      } else {
        favoritesList.push(id);
      }
      localStorage.setItem('vocal_favs_v2', JSON.stringify(favoritesList));
      updateFavBadge();
      renderAudioCards();
    }

    function shareAudio(title, audioId) {
      const baseUrl = window.location.href.split('#')[0].split('?')[0];
      const siteAudioUrl = `${baseUrl}#audio=${audioId}`;
      const shareData = { title: 'آهات صوتية', text: `استمع إلى المؤثر الصوتي: ${title}`, url: siteAudioUrl };
      if (navigator.share) {
        navigator.share(shareData).catch(()=>{});
      } else {
        navigator.clipboard.writeText(siteAudioUrl).then(() => alert('تم نسخ رابط الموقع الخاص بالصوت إلى الحافظة بنجاح!')).catch(() => alert('تعذر نسخ الرابط.'));
      }
    }

    function checkUrlHashForAudio(allPool) {
      const hash = window.location.hash;
      if (hash && hash.includes('audio=')) {
        const targetId = hash.split('audio=')[1];
        const targetItem = allPool.find(i => i.id === targetId);
        if (targetItem) {
          const tabBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.textContent.includes(targetItem.category));
          if (tabBtn) switchTab(targetItem.category, tabBtn);
          setTimeout(() => {
            const card = document.getElementById(`card-${targetId}`);
            if (card) {
              card.scrollIntoView({ behavior: 'smooth', block: 'center' });
              card.style.border = '2px solid var(--primary-color)';
              setTimeout(() => togglePlay(targetItem.id, targetItem.url), 500);
            }
          }, 300);
        }
      }
    }

    function renderAudioCards() {
      const container = document.getElementById('audioContainer');
      container.innerHTML = '';
      const searchTerm = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      let listToRender = [];

      if (currentTab === 'all') {
        listToRender = [...randomAllAudio];
      } else if (currentTab === 'favorites') {
        let pool = [...categoriesData['آهات'], ...categoriesData['مؤثرات'], ...categoriesData['انتقالات'], ...categoriesData['صوت']];
        const map = new Map(); pool.forEach(i => map.set(i.id, i));
        listToRender = favoritesList.map(id => map.get(id)).filter(Boolean).reverse();
      } else {
        listToRender = [...(categoriesData[currentTab] || [])];
      }

      const filtered = listToRender.filter(item => {
        return item.title.toLowerCase().includes(searchTerm) || item.desc.toLowerCase().includes(searchTerm);
      });

      if (filtered.length === 0) {
        if (currentTab === 'favorites') {
          container.innerHTML = `<div class="status-message">قائمة المفضلة فارغة حالياً. اضغط على القلب لإضافة الصوتيات هنا!</div>`;
        } else {
          container.innerHTML = `<div class="status-message">لا توجد نتائج مطابقة لبحثك في هذا القسم.</div>`;
        }
        return;
      }

      const frag = document.createDocumentFragment();
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'audio-card';
        card.id = `card-${item.id}`;
        const safeTitle = item.title.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const isFav = favoritesList.includes(item.id) ? 'is-fav' : '';
        const favIcon = favoritesList.includes(item.id) ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
        const isPlaying = activePlayers[item.id] && !activePlayers[item.id].audio.paused;
        const playIconClass = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        const datesHtml = item.dateAdded ? `<div class="audio-dates-inline"><div class="date-item added" title="تاريخ الإضافة"><i class="fa-regular fa-calendar"></i> <span>أضيف: ${item.dateAdded}</span></div></div>` : '';

        card.innerHTML = `
          <div class="audio-layout-top">
            <div style="display:flex;gap:14px;align-items:flex-start;">
              <div class="music-note-icon"><i class="fa-solid fa-music"></i></div>
              <div style="flex:1;min-width:0;">
                <div class="audio-title">${item.title}</div>
                <div style="font-size:0.8rem;font-weight:500;color:var(--desc-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  <span style="color:var(--primary-color);font-weight:700;margin-inline-start:4px;">الوصف:</span>
                  <span>${item.desc}</span>
                </div>
              </div>
            </div>
            ${datesHtml}
          </div>
          <div class="player-controls-container">
            <div class="timeline-container">
              <div class="timeline" id="timeline-${item.id}" onmousedown="startSeek(event,'${item.id}')" ontouchstart="startSeek(event,'${item.id}')">
                <div class="progress-bar" id="progress-${item.id}"></div>
              </div>
              <div class="time-labels">
                <span id="current-${item.id}">00:00</span>
                <span id="duration-${item.id}">00:00</span>
              </div>
            </div>
            <div class="buttons-row">
              <button class="control-btn btn-play-pause" onclick="togglePlay('${item.id}','${item.url.replace(/'/g,"\\'")}')">
                <i class="${playIconClass}" id="icon-${item.id}"></i>
              </button>
              <div style="display:flex;align-items:center;gap:10px;">
                <button class="control-btn btn-share-action" title="مشاركة أو نسخ رابط الموقع للصوت" onclick="shareAudio('${safeTitle}','${item.id}')"><i class="fa-solid fa-share-nodes"></i></button>
                <button class="control-btn btn-fav-toggle ${isFav}" data-fav-id="${item.id}" title="إضافة للمفضلة" onclick="toggleFavorite('${item.id}')"><i class="${favIcon}"></i></button>
                <button class="control-btn btn-loop-toggle ${activePlayers[item.id] && activePlayers[item.id].audio.loop ? 'is-looping' : ''}" id="loop-${item.id}" onclick="toggleLoop('${item.id}')"><i class="fa-solid fa-repeat"></i></button>
                <button class="control-btn btn-download-action" data-url="${item.downloadUrl}" data-title="${safeTitle}" onclick="downloadAudio(this)"><i class="fa-solid fa-download"></i></button>
              </div>
            </div>
          </div>
        `;
        frag.appendChild(card);
      });

      container.appendChild(frag);

      // attach events for already active players
      Object.keys(activePlayers).forEach(id => {
        if (document.getElementById(`progress-${id}`)) setupAudioEvents(id);
      });
    }

    function setupAudioEvents(id) {
      const player = activePlayers[id];
      if (!player) return;
      const audio = player.audio;
      const progressBar = document.getElementById(`progress-${id}`);
      const currentTxt = document.getElementById(`current-${id}`);
      const durationTxt = document.getElementById(`duration-${id}`);
      const icon = document.getElementById(`icon-${id}`);

      audio.ontimeupdate = () => {
        if (audio.duration) {
          const pct = (audio.currentTime / audio.duration) * 100;
          if (progressBar) progressBar.style.width = pct + '%';
          if (currentTxt) currentTxt.textContent = formatTime(audio.currentTime);
        }
      };

      audio.onloadedmetadata = () => {
        if (durationTxt) durationTxt.textContent = formatTime(audio.duration);
      };

      audio.onended = () => {
        if (!audio.loop) {
          if (icon) icon.className = 'fa-solid fa-play';
          if (progressBar) progressBar.style.width = '0%';
          if (currentTxt) currentTxt.textContent = '00:00';
        }
      };
    }

    function togglePlay(id, url) {
      const icon = document.getElementById(`icon-${id}`);
      if (!activePlayers[id]) {
        activePlayers[id] = { audio: new Audio(url) };
        activePlayers[id].audio.preload = 'metadata';
      }
      const audio = activePlayers[id].audio;

      // pause others
      Object.keys(activePlayers).forEach(k => {
        if (k !== id && !activePlayers[k].audio.paused) {
          activePlayers[k].audio.pause();
          const otherIcon = document.getElementById(`icon-${k}`);
          if (otherIcon) otherIcon.className = 'fa-solid fa-play';
        }
      });

      setupAudioEvents(id);

      if (audio.paused) {
        audio.play().then(() => {
          if (icon) icon.className = 'fa-solid fa-pause';
        }).catch(err => console.error(err));
      } else {
        audio.pause();
        if (icon) icon.className = 'fa-solid fa-play';
      }
    }

    // Seeking logic
    let isDragging = false;
    let currentSeekId = null;

    function startSeek(e, id) {
      isDragging = true;
      currentSeekId = id;
      processSeek(e, id);
      window.addEventListener('mousemove', handleGlobalMove);
      window.addEventListener('touchmove', handleGlobalMove, { passive: false });
      window.addEventListener('mouseup', stopSeek);
      window.addEventListener('touchend', stopSeek);
    }

    function handleGlobalMove(e) {
      if (!isDragging || !currentSeekId) return;
      if (e.type === 'touchmove') e.preventDefault();
      processSeek(e, currentSeekId);
    }

    function processSeek(e, id) {
      const player = activePlayers[id];
      if (!player) return;
      const audio = player.audio;
      const timeline = document.getElementById('timeline-' + id);
      if (!timeline || !audio) return;
      const rect = timeline.getBoundingClientRect();
      const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      let pct = (clientX - rect.left) / rect.width;
      pct = Math.max(0, Math.min(1, pct));
      if (audio.duration) audio.currentTime = pct * audio.duration;
      const progress = document.getElementById('progress-' + id);
      if (progress) progress.style.width = (pct * 100) + '%';
    }

    function stopSeek() {
      isDragging = false;
      currentSeekId = null;
      window.removeEventListener('mousemove', handleGlobalMove);
      window.removeEventListener('touchmove', handleGlobalMove);
      window.removeEventListener('mouseup', stopSeek);
      window.removeEventListener('touchend', stopSeek);
    }

    function toggleLoop(id) {
      if (!activePlayers[id]) {
        // create audio but don't autoplay
        const el = document.querySelector(`[data-fav-id="${id}"]`) || document.getElementById(`loop-${id}`);
        activePlayers[id] = { audio: new Audio() };
      }
      const audio = activePlayers[id].audio;
      audio.loop = !audio.loop;
      const btn = document.getElementById(`loop-${id}`);
      if (btn) btn.classList.toggle('is-looping', audio.loop);
    }

    function downloadAudio(btn) {
      const url = btn.getAttribute('data-url');
      const title = btn.getAttribute('data-title') || 'audio';
      if (!url) return;
      // attempt to download via anchor
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title}.mp3`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return '00:00';
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function filterAndSearchAudio() {
      renderAudioCards();
    }

    // Initialize
    updateFavBadge();
    fetchAllSheetsData();

    // If user presses Enter in search, keep focus nice
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') e.preventDefault();
    });
  </script>
</body>
</html>
